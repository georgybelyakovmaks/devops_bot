- name: Install required packages
  apt:
    name:
      - python3
      - python3-pip
      - git
    state: present
    update_cache: yes

- name: Clone bot repository
  git:
    repo: https://github.com/georgybelyakovmaks/devops_bot.git
    dest: /home/bot/devops_bot

- name: Install Python requirements
  pip:
    requirements: /home/bot/devops_bot/requirements.txt
    executable: pip3

- name: Run the bot
  command: python3 /home/bot/devops_bot/bot.py
  async: 1
  poll: 0
